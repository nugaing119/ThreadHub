name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: "${POSTGRES_IMAGE_REPOSITORY:?load versions}:${POSTGRES_IMAGE_TAG:?load versions}@${POSTGRES_IMAGE_DIGEST:?load versions}"
    platform: linux/amd64
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    environment:
      POSTGRES_USER: threadhub
      POSTGRES_PASSWORD: "${INTEGRATION_DB_PASSWORD:?generated integration secret required}"
      POSTGRES_DB: threadhub
    volumes:
      - type: bind
        source: "${INTEGRATION_DATA_ROOT:?set INTEGRATION_DATA_ROOT}/postgres"
        target: /var/lib/postgresql
    networks:
      - database
    healthcheck:
      test: [CMD-SHELL, pg_isready -U threadhub -d threadhub]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    logging: &safe-logging
      driver: json-file
      options:
        max-size: 2m
        max-file: "1"

  smtp-fixture:
    image: "threadhub/notifier-smtp-fixture:${NOTIFIER_VERSION:?load versions}"
    pull_policy: never
    platform: linux/amd64
    user: "65532:65532"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      FIXTURE_SMTP_ADDRESS: ":587"
      FIXTURE_API_ADDRESS: ":8081"
      FIXTURE_SMTP_HOST: smtp.email.ap-singapore-1.oci.oraclecloud.com
      FIXTURE_SMTP_USERNAME: integration-smtp-user
      FIXTURE_SMTP_PASSWORD: "${INTEGRATION_SMTP_PASSWORD:?generated integration secret required}"
      FIXTURE_HASH_SECRET: "${INTEGRATION_HASH_SECRET:?generated integration secret required}"
      FIXTURE_CERT_DIR: /run/smtp-private
      FIXTURE_CA_PATH: /run/smtp-ca/ca.crt
      FIXTURE_STATE_PATH: /run/smtp-private/captures.json
      FIXTURE_THREADHUB_DOMAIN: threadhub-existing.integration.test
    ports:
      - target: 8081
        published: "49353"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/smtp-private"
        target: /run/smtp-private
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/smtp-ca"
        target: /run/smtp-ca
    networks:
      - smtp-base
    healthcheck:
      test: [CMD, /smtp-fixture, healthcheck]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    logging: *safe-logging

  mattermost:
    image: "${MATTERMOST_IMAGE_REPOSITORY:?load versions}:${MATTERMOST_IMAGE_TAG:?load versions}@${MATTERMOST_IMAGE_DIGEST:?load versions}"
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    ports:
      - target: 8065
        published: "49153"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      TZ: UTC
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://threadhub:${INTEGRATION_DB_PASSWORD}@postgres:5432/threadhub?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: https://threadhub-existing.integration.test
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_TEAMSETTINGS_ENABLEUSERCREATION: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "true"
      MM_EMAILSETTINGS_ENABLESIGNUPWITHEMAIL: "true"
      MM_EMAILSETTINGS_ENABLESIGNINWITHEMAIL: "true"
      MM_EMAILSETTINGS_ENABLESIGNINWITHUSERNAME: "true"
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: "false"
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "false"
      MM_PASSWORDSETTINGS_MINIMUMLENGTH: "12"
      MM_SERVICESETTINGS_ENABLEINCOMINGWEBHOOKS: "false"
      MM_SERVICESETTINGS_ENABLEOUTGOINGWEBHOOKS: "false"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "false"
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: "false"
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_LOGSETTINGS_ENABLECONSOLE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
      MM_LOGSETTINGS_CONSOLEJSON: "true"
      MM_LOGSETTINGS_ENABLEFILE: "true"
      MM_LOGSETTINGS_FILELEVEL: ERROR
      MM_LOGSETTINGS_FILEJSON: "true"
      MM_LOGSETTINGS_FILELOCATION: /mattermost/logs/mattermost.log
      MM_LOGSETTINGS_ENABLEWEBHOOKDEBUGGING: "false"
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
    volumes:
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/config"
        target: /mattermost/config
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/data"
        target: /mattermost/data
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/logs"
        target: /mattermost/logs
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/plugins"
        target: /mattermost/plugins
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/client/plugins"
        target: /mattermost/client/plugins
      - type: bind
        source: "${INTEGRATION_DATA_ROOT}/mattermost/bleve-indexes"
        target: /mattermost/bleve-indexes
    networks:
      - database
      - application
      - outbound
    logging: *safe-logging

networks:
  database:
    internal: true
  application:
    internal: true
  smtp-base:
    internal: true
  outbound: {}
