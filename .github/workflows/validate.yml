name: Validate deployment package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan repository and history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location "${url}" --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          install -d -m 0755 "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" git --redact --no-banner .

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y expect nginx shellcheck

      - name: Validate repository diff
        run: git diff --check HEAD^ HEAD

      - name: Validate deployment files
        run: ./deploy/scripts/validate.sh

      - name: Run ShellCheck
        run: shellcheck -x -P deploy/scripts deploy/scripts/*.sh deploy/tests/*.sh

      - name: Test notifier installer gates
        run: ./deploy/tests/notifier-installer-test.sh

      - name: Exercise guided configuration and unattended handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rm -f deploy/.env /tmp/wizard-configure-output /tmp/wizard-existing-output' EXIT

          expect <<'EOF'
          set timeout 30
          log_user 0
          log_file -noappend /tmp/wizard-configure-output
          spawn ./deploy/scripts/setup-wizard.sh --configure-only
          expect "ThreadHub public domain: "
          send "threadhub-ci.test.net\r"
          expect "Let's Encrypt contact email: "
          send "ci@test.net\r"
          expect "OCI Email Delivery region*"
          send "ap-singapore-1\r"
          expect "OCI SMTP username: "
          send "fixture_smtp_user\r"
          expect "OCI SMTP password: "
          send "fixture_smtp_password\r"
          expect "Approved sender address: "
          send "no-reply@test.net\r"
          expect "Reply-to address*"
          send "\r"
          expect "Sender display name*"
          send "\r"
          expect eof
          catch wait result
          exit [lindex $result 3]
          EOF

          test "$(stat -c '%a' deploy/.env)" = 600
          test "$(awk -F= '$1 == "NOTIFIER_ENABLED" { print $2 }' deploy/.env)" = true
          test "$(awk -F= '$1 == "NOTIFIER_MODE" { print $2 }' deploy/.env)" = all_channels
          test -z "$(awk -F= '$1 == "NOTIFIER_CHANNEL_IDS" { print $2 }' deploy/.env)"
          test "$(awk -F= '$1 == "NOTIFIER_RATE_PER_MINUTE" { print $2 }' deploy/.env)" = 10
          notifier_hmac="$(awk -F= '$1 == "NOTIFIER_HMAC_SECRET" { gsub(/\047/, "", $2); print $2 }' deploy/.env)"
          test "${#notifier_hmac}" -eq 64
          test -z "${notifier_hmac//[0-9a-f]/}"
          ! grep -F -- "${notifier_hmac}" /tmp/wizard-configure-output
          ! grep -F -- 'fixture_smtp_password' /tmp/wizard-configure-output
          ./deploy/scripts/deploy.sh --validate-only

          sed -i '/^NOTIFIER_/d' deploy/.env
          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive \
            >/tmp/wizard-existing-output 2>&1
          existing_status=$?
          set -e
          test "${existing_status}" -eq 20
          grep -Fx '[ACTION REQUIRED] Run ./deploy/scripts/configure-notifier.sh' \
            /tmp/wizard-existing-output >/dev/null

          printf '%s\n' 'NOTIFIER_ENABLED=true' >>deploy/.env
          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive \
            >/tmp/wizard-existing-output 2>&1
          partial_status=$?
          set -e
          test "${partial_status}" -eq 20
          grep -F '[ACTION REQUIRED] Notifier configuration is partial;' \
            /tmp/wizard-existing-output >/dev/null
          rm -f deploy/.env

          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive >/tmp/wizard-output 2>&1
          wizard_status=$?
          ./deploy/scripts/install-status.sh >/tmp/status-output 2>&1
          status_status=$?
          set -e

          test "${wizard_status}" -eq 20
          test "${status_status}" -eq 20
          grep -F '[ACTION REQUIRED]' /tmp/wizard-output >/dev/null
          grep -F '[ACTION REQUIRED]' /tmp/status-output >/dev/null

      - name: Verify immutable image manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          source deploy/versions.env
          docker manifest inspect "${MATTERMOST_IMAGE_REPOSITORY}@${MATTERMOST_IMAGE_DIGEST}" >/dev/null
          docker manifest inspect "${POSTGRES_IMAGE_REPOSITORY}@${POSTGRES_IMAGE_DIGEST}" >/dev/null

      - name: Validate NGINX templates
        shell: bash
        run: |
          set -Eeuo pipefail
          domain=threadhub-ci.example.com
          temp_config="${RUNNER_TEMP}/threadhub.conf"

          sed "s/__THREADHUB_DOMAIN__/${domain}/g" \
            deploy/nginx/threadhub-bootstrap.conf.template \
            > "${temp_config}"
          sudo install -m 0644 "${temp_config}" /etc/nginx/conf.d/threadhub.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

          sudo install -d -m 0755 "/etc/letsencrypt/live/${domain}"
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=${domain}" \
            -keyout "/etc/letsencrypt/live/${domain}/privkey.pem" \
            -out "/etc/letsencrypt/live/${domain}/fullchain.pem" \
            >/dev/null 2>&1
          sed "s/__THREADHUB_DOMAIN__/${domain}/g" \
            deploy/nginx/threadhub.conf.template \
            > "${temp_config}"
          sudo install -m 0644 "${temp_config}" /etc/nginx/conf.d/threadhub.conf
          sudo nginx -t
