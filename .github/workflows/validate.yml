name: Validate deployment package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Scan repository and history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          scan_log="${RUNNER_TEMP}/gitleaks-history.log"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cleanup() {
            rm -rf "${archive}" "${install_dir}" "${scan_log}"
          }
          trap cleanup EXIT

          curl --fail --silent --show-error --location "${url}" --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          install -d -m 0755 "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          if ! "${install_dir}/gitleaks" git --redact --no-banner --log-opts='--all' . \
            >"${scan_log}" 2>&1; then
            printf '%s\n' 'Repository history secret scan failed; diagnostics remain private.' >&2
            exit 1
          fi
          rm -f "${scan_log}"

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y expect nginx

      - name: Install pinned ShellCheck
        shell: bash
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_LINUX_X64_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          install_dir="${RUNNER_TEMP}/shellcheck"
          url="https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

          curl --fail --silent --show-error --location "${url}" --output "${archive}"
          printf '%s  %s\n' "${SHELLCHECK_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          install -d -m 0755 "${install_dir}"
          tar -xJf "${archive}" -C "${install_dir}" --strip-components=1 \
            "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          test -x "${install_dir}/shellcheck"
          test "$("${install_dir}/shellcheck" --version | awk '$1 == "version:" { print $2 }')" = "${SHELLCHECK_VERSION}"

      - name: Validate repository diff
        run: git diff --check HEAD^ HEAD

      - name: Validate deployment files
        run: ./deploy/scripts/validate.sh

      - name: Run ShellCheck
        run: '"${RUNNER_TEMP}/shellcheck/shellcheck" -x -P deploy/scripts deploy/scripts/*.sh deploy/tests/*.sh deploy/integration/backup/*.sh'

      - name: Clean pinned ShellCheck
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "${RUNNER_TEMP}/shellcheck.tar.xz" "${RUNNER_TEMP}/shellcheck"

      - name: Test notifier installer gates
        run: |
          ./deploy/tests/notifier-installer-test.sh
          ./deploy/tests/notifier-installer-security-test.sh

      - name: Exercise guided configuration and unattended handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          privacy_patterns=/tmp/wizard-private-patterns
          trap 'rm -f deploy/.env /tmp/wizard-configure-output /tmp/wizard-existing-output "${privacy_patterns}"' EXIT
          umask 077
          : > "${privacy_patterns}"
          chmod 0600 "${privacy_patterns}"

          expect <<'EOF'
          set timeout 30
          log_user 0
          log_file -noappend /tmp/wizard-configure-output
          spawn ./deploy/scripts/setup-wizard.sh --configure-only
          expect "ThreadHub public domain: "
          send "threadhub-ci.test.net\r"
          expect "Let's Encrypt contact email: "
          send "ci@test.net\r"
          expect "OCI Email Delivery region*"
          send "ap-singapore-1\r"
          expect "OCI SMTP username: "
          send "fixture_smtp_user\r"
          expect "OCI SMTP password: "
          send "fixture_smtp_password\r"
          expect "Approved sender address: "
          send "no-reply@test.net\r"
          expect "Reply-to address*"
          send "\r"
          expect "Sender display name*"
          send "\r"
          expect eof
          catch wait result
          exit [lindex $result 3]
          EOF

          test "$(stat -c '%a' deploy/.env)" = 600
          test "$(awk -F= '$1 == "NOTIFIER_ENABLED" { print $2 }' deploy/.env)" = true
          test "$(awk -F= '$1 == "NOTIFIER_MODE" { print $2 }' deploy/.env)" = all_channels
          test -z "$(awk -F= '$1 == "NOTIFIER_CHANNEL_IDS" { print $2 }' deploy/.env)"
          test "$(awk -F= '$1 == "NOTIFIER_RATE_PER_MINUTE" { print $2 }' deploy/.env)" = 10
          notifier_hmac="$(awk -F= '$1 == "NOTIFIER_HMAC_SECRET" { gsub(/\047/, "", $2); print $2 }' deploy/.env)"
          test "${#notifier_hmac}" -eq 64
          test -z "${notifier_hmac//[0-9a-f]/}"
          builtin printf '%s\n' "${notifier_hmac}" 'fixture_smtp_password' > "${privacy_patterns}"
          if grep -F -q -f "${privacy_patterns}" /tmp/wizard-configure-output; then
            printf '%s\n' '[redacted privacy failure] Wizard output disclosed protected configuration.' >&2
            exit 1
          fi
          ./deploy/scripts/deploy.sh --validate-only

          sed -i '/^NOTIFIER_/d' deploy/.env
          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive \
            >/tmp/wizard-existing-output 2>&1
          existing_status=$?
          set -e
          test "${existing_status}" -eq 20
          grep -Fx '[ACTION REQUIRED] Run ./deploy/scripts/configure-notifier.sh' \
            /tmp/wizard-existing-output >/dev/null

          printf '%s\n' 'NOTIFIER_ENABLED=true' >>deploy/.env
          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive \
            >/tmp/wizard-existing-output 2>&1
          partial_status=$?
          set -e
          test "${partial_status}" -eq 20
          grep -F '[ACTION REQUIRED] Notifier configuration is partial;' \
            /tmp/wizard-existing-output >/dev/null
          rm -f deploy/.env

          set +e
          ./deploy/scripts/setup-wizard.sh --non-interactive >/tmp/wizard-output 2>&1
          wizard_status=$?
          ./deploy/scripts/install-status.sh >/tmp/status-output 2>&1
          status_status=$?
          set -e

          test "${wizard_status}" -eq 20
          test "${status_status}" -eq 20
          grep -F '[ACTION REQUIRED]' /tmp/wizard-output >/dev/null
          grep -F '[ACTION REQUIRED]' /tmp/status-output >/dev/null

      - name: Verify immutable image manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          source deploy/versions.env
          docker manifest inspect "${MATTERMOST_IMAGE_REPOSITORY}@${MATTERMOST_IMAGE_DIGEST}" >/dev/null
          docker manifest inspect "${POSTGRES_IMAGE_REPOSITORY}@${POSTGRES_IMAGE_DIGEST}" >/dev/null

      - name: Validate NGINX templates
        shell: bash
        run: |
          set -Eeuo pipefail
          domain=threadhub-ci.example.com
          temp_config="${RUNNER_TEMP}/threadhub.conf"

          sed "s/__THREADHUB_DOMAIN__/${domain}/g" \
            deploy/nginx/threadhub-bootstrap.conf.template \
            > "${temp_config}"
          sudo install -m 0644 "${temp_config}" /etc/nginx/conf.d/threadhub.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

          sudo install -d -m 0755 "/etc/letsencrypt/live/${domain}"
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=${domain}" \
            -keyout "/etc/letsencrypt/live/${domain}/privkey.pem" \
            -out "/etc/letsencrypt/live/${domain}/fullchain.pem" \
            >/dev/null 2>&1
          sed "s/__THREADHUB_DOMAIN__/${domain}/g" \
            deploy/nginx/threadhub.conf.template \
            > "${temp_config}"
          sudo install -m 0644 "${temp_config}" /etc/nginx/conf.d/threadhub.conf
          sudo nginx -t

  backup-restore-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.14
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.14
          cache-dependency-path: notifier/go.sum

      - name: Install backup integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect jq zstd

      - name: Run static and unit validation
        run: ./deploy/scripts/validate.sh

      - name: Run isolated real-image backup and restore
        run: sudo --preserve-env=PATH ./deploy/integration/backup/run.sh

      - name: Verify guarded integration cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo test ! -e /srv/threadhub
          sudo test ! -e /srv/threadhub-backup-integration-source
          sudo test ! -e /var/lib/threadhub-backup
          sudo test ! -e /etc/threadhub
          test ! -e deploy/.env

  notifier-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go 1.25.14
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.14
          cache-dependency-path: notifier/go.sum

      - name: Run notifier unit and race tests
        working-directory: notifier
        run: make test

      - name: Scan notifier for reachable Go vulnerabilities
        working-directory: notifier
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Verify notifier repository pins
        working-directory: notifier
        run: make verify-pins

      - name: Install pinned notifier artifact scanner
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl --fail --silent --show-error --location "${url}" --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check -
          install -d -m 0755 "${install_dir}"
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          test "$("${install_dir}/gitleaks" version)" = 8.30.1

      - name: Test privacy-safe notifier artifact scanner
        shell: bash
        run: |
          set -Eeuo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks"
          GITLEAKS_BIN="${install_dir}/gitleaks" ./deploy/tests/notifier-artifact-security-test.sh

      - name: Build notifier artifacts
        working-directory: notifier
        run: make plugin-bundle mailer

      - name: Scan exact notifier artifacts for embedded secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          install_dir="${RUNNER_TEMP}/gitleaks"
          GITLEAKS_BIN="${install_dir}/gitleaks" ./deploy/scripts/verify-notifier-artifacts.sh

      - name: Clean pinned notifier artifact scanner
        if: always() # scanner cleanup must run after install, fixture, build or scan failure
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "${RUNNER_TEMP}/gitleaks.tar.gz" "${RUNNER_TEMP}/gitleaks"

      - name: Record privacy-safe bundle identity
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/threadhub-notifier-integration-artifacts"
          install -d -m 0755 "${artifact_dir}"
          notifier_version="$(awk -F= '$1 == "NOTIFIER_VERSION" { count++; value=$2 } END { if (count != 1 || value !~ /^[0-9]+\.[0-9]+\.[0-9]+$/) exit 1; print value }' deploy/versions.env)"
          plugin_id="$(awk -F= '$1 == "NOTIFIER_PLUGIN_ID" { count++; value=$2 } END { if (count != 1 || value != "com.threadhub.channel-email-notifier") exit 1; print value }' deploy/versions.env)"
          bundle_path="notifier/dist/${plugin_id}-${notifier_version}.tar.gz"
          [[ -f "${bundle_path}" && ! -L "${bundle_path}" ]]
          bundle_sha="$(sha256sum "${bundle_path}" | awk '{print $1}')"
          [[ "${bundle_sha}" =~ ^[a-f0-9]{64}$ ]]
          printf 'bundle_sha256=%s\n' "${bundle_sha}" >"${artifact_dir}/bundle-sha256.txt"
          chmod 0644 "${artifact_dir}/bundle-sha256.txt"

      - name: Run isolated real-image integration
        working-directory: notifier
        env:
          INTEGRATION_RESULT_FILE: ${{ runner.temp }}/threadhub-notifier-integration-artifacts/results.txt
        run: make integration

      - name: Upload privacy-safe integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notifier-integration-evidence
          path: ${{ runner.temp }}/threadhub-notifier-integration-artifacts
          if-no-files-found: error
          retention-days: 7

  notifier-mailer-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify cross-host Mailer image identity
        run: ./deploy/tests/notifier-mailer-reproducibility-test.sh

  notifier-existing-adoption:
    needs: notifier-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go 1.25.14
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.25.14
          cache-dependency-path: notifier/go.sum

      - name: Run existing Mattermost notifier adoption
        shell: bash
        env:
          FRESH_INTEGRATION_VERIFIED: "true"
          INTEGRATION_RESULT_FILE: ${{ runner.temp }}/threadhub-existing-adoption-evidence/results.txt
          INTEGRATION_PUBLIC_EVIDENCE_FILE: ${{ runner.temp }}/threadhub-existing-adoption-evidence/public-evidence.txt
          INTEGRATION_SAFE_DIAGNOSTIC_FILE: ${{ runner.temp }}/threadhub-existing-adoption-evidence/safe-diagnostic.txt
          INTEGRATION_PROGRESS_FILE: ${{ runner.temp }}/threadhub-existing-adoption-evidence/progress.txt
        run: |
          set -Eeuo pipefail
          install -d -m 0755 "${RUNNER_TEMP}/threadhub-existing-adoption-evidence"
          ./notifier/integration/run-existing-adoption.sh

      - name: Upload privacy-safe existing-adoption evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notifier-existing-adoption-evidence
          path: ${{ runner.temp }}/threadhub-existing-adoption-evidence
          if-no-files-found: error
          retention-days: 7
